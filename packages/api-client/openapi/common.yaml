openapi: 3.1.0
info:
  title: Shared API conventions
  version: 1.0.0
  description: >
    Components shared by the task and notification APIs (contracts/http-api.md, "Shared
    public conventions"). Application IDs, versions and policy epochs are canonical positive
    decimal strings, never JSON numbers; user IDs are Supabase Auth UUIDs. Referenced from
    services/task-api/openapi/http-api.yaml and services/notifications/openapi/http-api.yaml.
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth user access token (ES256). API keys are not user tokens.

  schemas:
    Id:
      type: string
      description: >
        Sequence-generated application ID as a canonical positive decimal string in
        1..9223372036854775807 (no sign, no leading zeros, no exponent). The pattern bounds
        the length; servers and packages/api-client/src/ids.ts also reject values above the
        bigint maximum. JSON numbers are rejected with 422.
      pattern: '^[1-9][0-9]{0,18}$'
      minLength: 1
      maxLength: 19
      examples: ['9007199254740993']
    Version:
      allOf:
        - $ref: '#/components/schemas/Id'
      description: Monotonic bigint task version as a decimal string; ETags carry the same value.
    UserId:
      type: string
      format: uuid
      description: Supabase Auth user UUID.
    Timestamp:
      type: string
      format: date-time
      description: UTC RFC 3339 instant.
    TimeZone:
      type: string
      minLength: 1
      maxLength: 64
      description: IANA time-zone name known to the server (pg_timezone_names).
      examples: ['Europe/Berlin']
    Cursor:
      type: string
      minLength: 1
      maxLength: 2048
      description: >
        Opaque keyset cursor bound to the request's search, filter and sort parameters.
        Kept in query memory only, never in page URLs or browser storage.
    UserSummary:
      type: object
      description: Directory identity. Contains only the stable ID, display name and email.
      additionalProperties: false
      required: [id, displayName, email]
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email

    ProblemCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - STALE_VERSION
        - IDEMPOTENCY_CONFLICT
        - PAST_DEADLINE_CONFIRMATION_REQUIRED
        - PRECONDITION_REQUIRED
        - NOT_FOUND
        - FORBIDDEN
        - UNAUTHENTICATED
        - DEPENDENCY_UNAVAILABLE
        - RATE_LIMITED
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_CONTENT
        - OPERATION_IN_PROGRESS
        - INTERNAL_ERROR
    FieldError:
      type: object
      description: >
        Allowlisted DTO field path (for example title, assigneeId, dueAt, dueTimeZone,
        reason, proposedDueAt), a stable error code and a human-readable message. Clients map
        only known paths to fields; anything else goes to the form banner.
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
          maxLength: 100
        code:
          type: string
          maxLength: 64
        message:
          type: string
          maxLength: 500
    Problem:
      type: object
      description: application/problem+json body. Never contains stack traces, SQL or task text.
      required: [type, title, status, code, detail, requestId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/ProblemCode'
        detail:
          type: string
        requestId:
          type: [string, 'null']
          description: Server-generated request ID, also returned as X-Request-Id.
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        currentVersion:
          $ref: '#/components/schemas/Version'
          description: Present on STALE_VERSION, only after the caller is authorized.

  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted current task version, e.g. "42". Missing=428, stale=409 STALE_VERSION.
      schema:
        type: string
        pattern: '^"[1-9][0-9]{0,18}"$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Client-generated UUID, stable across retries of the same mutation for seven days.
        Reusing a key with a different body returns 409 IDEMPOTENCY_CONFLICT.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      description: nextCursor from the previous page; omit for the first page.
      schema:
        $ref: '#/components/schemas/Cursor'
    TaskId:
      name: id
      in: path
      required: true
      description: Unknown and inaccessible tasks both return 404.
      schema:
        $ref: '#/components/schemas/Id'

  headers:
    ETag:
      description: Quoted decimal task version.
      schema:
        type: string
        pattern: '^"[1-9][0-9]{0,18}"$'
    Location:
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
    RequestId:
      schema:
        type: string

  responses:
    ValidationFailed:
      description: VALIDATION_FAILED or PAST_DEADLINE_CONFIRMATION_REQUIRED (422)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: Missing, invalid or expired token, or inactive account (401)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Accessible resource, disallowed operation (403)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Unknown or inaccessible resource (404); the two are indistinguishable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: STALE_VERSION, IDEMPOTENCY_CONFLICT or OPERATION_IN_PROGRESS (409)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: If-Match is missing (428)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: File exceeds 10,000,000 bytes (413)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedContent:
      description: Unsupported or mismatched file type (415)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Rate limit exceeded (429)
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DependencyUnavailable:
      description: A required dependency (directory, storage, authorization check) is unavailable (503)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
