# Edge: serves the SPA and proxies only the allowlisted public paths to the Spring gateway.
# It makes no authentication decisions. Rendered by the nginx image's envsubst templating;
# only ${SUPABASE_PUBLISHABLE_KEY} (a public key) is substituted.

# Never log query strings (search terms, Realtime apikey).
log_format edge_redacted '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    access_log /dev/stdout edge_redacted;
    client_max_body_size 11m;

    include /etc/nginx/snippets/security-headers.conf;

    # Shared proxy settings: overwrite (never append) client forwarding headers.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_request_buffering off;

    location /api/v1/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Includes the public signing-key path /auth/v1/.well-known/jwks.json.
    location /auth/v1/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Connection "";
    }

    location = /realtime/v1/websocket {
        proxy_pass http://gateway:8080;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location = /config.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 200 '{"supabasePublishableKey":"${SUPABASE_PUBLISHABLE_KEY}"}';
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
